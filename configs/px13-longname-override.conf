# ASUS ProArt PX13 (HN7306EA/C): internal speaker (TAS2783) mapping.
#
# Mainline kernels announce the card without the "spk:tas2783" tag, so the
# default amd-soundwire.conf leaves SpeakerCodecFile empty and the HiFi
# profile exposes no Speaker port (PipeWire falls back to a dummy sink).
# This override forces the speaker codec and pulls in the tas2783 init.
#
# Named after the CardLongName and placed in conf.d/amd-soundwire/, so it is
# loaded before the default config and is owned by no package: it survives
# alsa-ucm-conf updates.

Include.base.File "/conf.d/amd-soundwire/amd-soundwire.conf"

# Force the speaker codec (must use If.codec_default.Append.Define, same
# structure as the base config; a top-level Define after the include has
# no effect).
If.codec_default.Append.Define {
	SpeakerCodec1 "tas2783"
	SpeakerCodecFile "tas2783"
}

# Pull in the codec init (defines SpeakerMixerElem and the stereo remap of
# the two amps). The base config's If.spk regex does not include tas2783,
# so it is included here explicitly.
Include.tas2783init.File "/codecs/tas2783/init.conf"
