Syntax 8

# ASUS ProArt PX13 (HN7306EA/C): internal speaker (TAS2783) mapping.
#
# Named after the CardLongName and placed in conf.d/amd-soundwire/, so it is
# loaded instead of the default amd-soundwire.conf, which it includes.
#
# The PX13 speaker files use their own name (px13-speaker) instead of
# tas2783: alsa-ucm-conf > 1.2.16.1 ships sof-soundwire/tas2783.conf and
# codecs/tas2783/init.conf for other (Intel) tas2783 boards, so files of ours
# under those paths would collide with the package, and its tas2783 config
# does not fit the AMD driver's controls.

Include.base.File "/conf.d/amd-soundwire/amd-soundwire.conf"

# Point the speaker at the PX13 files (must use If.codec_default.Append.Define,
# same structure as the base config; a top-level Define after the include has
# no effect). The name does not match the base config's codec init filter, so
# the base never includes a tas2783 init on top of ours.
If.codec_default.Append.Define {
	SpeakerCodec1 "tas2783"
	SpeakerCodecFile "px13-speaker"
}

# Codec init: defines SpeakerMixerElem and the stereo volume remap.
Include.px13init.File "/codecs/px13-speaker/init.conf"
