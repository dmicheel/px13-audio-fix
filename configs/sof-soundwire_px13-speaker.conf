# PX13 TAS2783 Speaker device for the sof-soundwire HiFi profile.
#
# Stereo needs no control here: the driver gives each amp one channel of the
# stream (upstream since 7.3).

SectionDevice."Speaker" {
    Comment "Speaker"

    EnableSequence [
    ]

    DisableSequence [
    ]

    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId},2"
        PlaybackMixer "default:${CardId}"
        PlaybackMixerElem "${var:SpeakerMixerElem}"
    }
}
