# TAS2783 Speaker device for the sof-soundwire HiFi profile.

SectionDevice."Speaker" {
    Comment "Speaker"

    # Stereo: one channel per amplifier via the 'Channel Playback' enum
    # (1=Left 2=Right). Guarded so a stock driver still gets a (mono) Speaker
    # device instead of a failed profile.
    If.chansel {
        Condition {
            Type ControlExists
            Control "name='tas2783-1 Channel Playback'"
        }
        True {
            EnableSequence [
                cset "name='tas2783-1 Channel Playback' 1"
                cset "name='tas2783-2 Channel Playback' 2"
            ]
        }
    }

    DisableSequence [
    ]

    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId},2"
        PlaybackMixer "default:${CardId}"
        PlaybackMixerElem "${var:SpeakerMixerElem}"
    }
}
