PACKAGE_NAME="snd-soc-tas2783-sdw-px13"
PACKAGE_VERSION="2.0"
BUILT_MODULE_NAME[0]="snd-soc-tas2783-sdw"
DEST_MODULE_LOCATION[0]="/updates"
BUILT_MODULE_NAME[1]="snd-soc-sdw-utils"
DEST_MODULE_LOCATION[1]="/updates"
MAKE[0]="make KVER=${kernelver}"
CLEAN="make KVER=${kernelver} clean"
# Sources are 7.2.8 plus upstream 7.3 fixes. 7.3+ ships the fixes itself and
# would be downgraded by this override, so never build for it.
BUILD_EXCLUSIVE_KERNEL="^7\.2\."
AUTOINSTALL="yes"
