# PX13 speaker EQ: 20-band reference curve (see eq_targets.txt) fitted as
# 20 peaking biquads/channel at Q = 0.8 (dense RMS error 0.08 dB,
# 30 Hz..20 kHz, verification table in tuning.conf) + lookahead limiter.
# Tonal correction only. Amplifier DSP protection runs in firmware and is
# unaffected.

