## ASUS ProArt PX13 (HN7306) internal speakers.
##
## Twenty fitted peaking biquads + lookahead limiter as a PipeWire
## filter-chain in front of the speaker sink: a 20-band tonal correction
## (~+2 dB bass/mids rolling off above 9 kHz) for this chassis. The
## amplifier DSP tuning + protection already run in firmware; this chain
## only shapes tone. Headphones are untouched (output pinned to the
## speaker sink).

description="ASUS ProArt PX13 (HN7306) speakers"
sink_pattern='^alsa_output\.pci-0000_c4_00\.5-platform-amd_sdw\.HiFi__Speaker__sink$'

## Targets: eq_targets.txt (Hz, dB per band at 48 kHz).
## Fit: least-squares per-band gains at constant Q=0.8 (Q<=0.7 diverges,
## Q>=0.9 fits worse), evaluated with RBJ cookbook math.
magnitude_rms_db="0.08"
bass_group_delay_swing_ms="0.0"
limiter_headroom_db="1.0"

